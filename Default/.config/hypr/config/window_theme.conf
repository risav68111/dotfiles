# windowrulev2 = opacity 0.85 override, class:^(Thunar)$

# Waypaper Zen Mode
# windowrulev2 = float, class:^(waypaper)$
# windowrulev2 = center, class:^(waypaper)$
# windowrulev2 = size 900 600, class:^(waypaper)$
# windowrulev2 = workspace special, class:^(waypaper)$
# windowrulev2 = noborder, class:^(waypaper)$
# windowrulev2 = dimaround, class:^(waypaper)$

# =============================================
# MONITOR CONFIGURATION
# =============================================

monitor = HDMI-A-2, modeline 542.25 2560 2776 3056 3552 1440 1443 1448 1527 -hsync +vsync, 1920x0, 1
monitor = eDP-1, preferred, 0x0, 1

# Cursor & Default behavior
cursor {
    default_monitor = HDMI-A-2
}

# Main monitor
workspace = 1, monitor:HDMI-A-2, default:true
workspace = 2, monitor:HDMI-A-2
workspace = 3, monitor:HDMI-A-2
workspace = 4, monitor:HDMI-A-2
workspace = 5, monitor:HDMI-A-2

# Secondary monitor
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1
